<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Reflectiv · Formulaire de réclamation</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8;--surface:#fff;--ink:#1D2939;--ink2:#344054;--muted:#667085;--line:#E4E7EC;--line2:#D0D5DD;
  --pri:#0B6E85;--pri-h:#095A6D;--pri-soft:#E4F3F6;--amber:#B54708;--amber-soft:#FEF0C7;--red:#B42318;--red-soft:#FEE4E2;--ok:#067647;--ok-soft:#DCFAE6;
  --shadow:0 1px 2px rgba(16,24,40,.05);--shadow-lg:0 16px 40px rgba(16,24,40,.14);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:.14em;font-size:15px}
.brand small{display:block;font-weight:500;letter-spacing:0;color:var(--muted);font-size:12px}
.spacer{flex:1}
.savest{font-size:12.5px;color:var(--muted);text-align:right}
.savest.err{color:var(--amber)}
.lang{border:1px solid var(--line2);border-radius:8px;padding:5px 8px;background:var(--surface);font-weight:600;font-size:13px}
main{max-width:860px;margin:0 auto;padding:18px 16px 120px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.steps button{flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:6px 12px 6px 6px;display:flex;gap:7px;align-items:center;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)}
.steps button i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--bg);color:var(--muted)}
.steps button.ok i{background:var(--ok);color:#fff}
.steps button.miss i{background:var(--amber-soft);color:var(--amber)}
.steps button[aria-current="step"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
@media (max-width:560px){.card{padding:16px}}
.card h1{font-size:21px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px}
.intro{background:var(--pri-soft);border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:14px}
.intro b{color:var(--pri)}
.intro ul{margin:6px 0 0;padding-left:18px}
.fields{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.f>label,.f>.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.f .req{color:var(--red);margin-left:2px}
.f .help{font-size:13px;color:var(--muted);margin:-2px 0 6px}
.inp{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px}
.inp:focus{border-color:var(--pri);outline:3px solid var(--pri-soft);outline-offset:0}
textarea.inp{min-height:110px;resize:vertical}
.f.bad .inp,.f.bad .opts{border-color:var(--amber)}
.f.bad .bad-msg{display:block}
.bad-msg{display:none;color:var(--amber);font-size:12.5px;margin-top:4px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px;border-radius:10px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;cursor:pointer;background:var(--surface);font-weight:500;font-size:14px}
.opt input{accent-color:var(--pri);width:17px;height:17px;margin:0}
.opt:has(input:checked){border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.typecards{display:grid;gap:10px}
.typecard{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--line2);border-radius:14px;padding:16px;cursor:pointer;background:var(--surface)}
.typecard input{margin-top:3px;accent-color:var(--pri);width:18px;height:18px}
.typecard strong{display:block;font-size:16px}
.typecard span{color:var(--muted);font-size:14px}
.typecard .ic{font-size:26px;line-height:1}
.typecard:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
.sub{font-size:12.5px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 -4px;padding-top:12px;border-top:1px solid var(--line)}
.sub:first-child{border-top:0;padding-top:0;margin-top:0}
.warn{background:var(--amber-soft);color:#7A2E0E;border-radius:10px;padding:11px 14px;font-size:13.5px}
.warn b{font-weight:700}
.tips{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink2);margin-bottom:16px}
.pcat{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.pcat.bad{border-color:var(--amber);background:#FFFCF5}
.pcat-h{display:flex;gap:10px;align-items:flex-start}
.pcat-h strong{display:block;font-size:15px}
.pcat-h span{color:var(--muted);font-size:13.5px}
.pcount{margin-left:auto;flex:none;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--bg);color:var(--muted)}
.pcount.ok{background:var(--ok-soft);color:var(--ok)}
.pcount.miss{background:var(--amber-soft);color:var(--amber)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:700}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;line-height:1}
.th .ld{position:absolute;inset:0;background:rgba(255,255,255,.7);display:grid;place-items:center}
.th.err{outline:2px solid var(--red)}
.addp{border:2px dashed var(--line2);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;text-align:center;color:var(--pri);font-weight:600;font-size:12.5px;cursor:pointer;background:#FAFBFC;padding:6px}
.addp:hover{border-color:var(--pri);background:var(--pri-soft)}
.na{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.na input{accent-color:var(--pri)}
.legal{background:var(--bg);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--ink2)}
.legal h2{font-size:15px;margin:0 0 8px;color:var(--ink)}
.legal ol{margin:0;padding-left:18px;display:grid;gap:6px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;padding:10px 12px;border:1px solid var(--line2);border-radius:10px}
.consent input{margin-top:3px;accent-color:var(--pri);width:18px;height:18px;flex:none}
.consent:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
.missing{background:var(--amber-soft);border-radius:12px;padding:12px 14px;font-size:14px;color:#7A2E0E}
.missing ul{margin:6px 0 0;padding-left:18px}
.missing a{color:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.review{display:grid;gap:12px}
.review section{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.review h3{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.review h3 button{border:0;background:none;color:var(--pri);font-weight:600;cursor:pointer;font-size:13px}
.review dl{margin:0;display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:4px 12px;font-size:13.5px}
.review dt{color:var(--muted)}
.review dd{margin:0;word-break:break-word}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line2);background:var(--surface);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);white-space:nowrap}
.btn:hover{background:#F9FAFB}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{background:var(--pri-h)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:560px){.btn{padding:10px 12px;font-size:14px}.bar .hide-s{display:none}}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border-radius:16px;padding:22px;max-width:480px;width:100%;box-shadow:var(--shadow-lg);display:grid;gap:12px}
.mbox h2{margin:0;font-size:18px}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0}
.center{text-align:center;padding:40px 22px}
.center .big{font-size:44px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100vw - 32px)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">REFLECTIV<small id="h-sub"></small></div>
  <div class="spacer"></div>
  <div class="savest" id="savest"></div>
  <select class="lang" id="lang" aria-label="Langue / Idioma / Language">
    <option value="fr">FR</option><option value="es">ES</option><option value="en">EN</option><option value="it">IT</option>
  </select>
</div></header>

<main>
  <div id="loading" class="card center"><span class="spin"></span></div>
  <div id="app" hidden>
    <nav class="steps" id="steps" aria-label="Étapes"></nav>
    <div class="card" id="card"></div>
  </div>
  <div id="done" class="card center" hidden></div>
</main>

<div class="bar" id="bar" hidden><div class="bar-in">
  <button class="btn ghost" id="b-prev"></button>
  <div class="spacer"></div>
  <button class="btn hide-s" id="b-later"></button>
  <button class="btn primary" id="b-next"></button>
</div></div>

<div class="modal" id="m-saved" hidden><div class="mbox">
  <h2 id="ms-t"></h2><p style="margin:0" id="ms-p"></p>
  <div class="linkbox"><input class="inp" id="ms-link" readonly><button class="btn" id="ms-copy"></button></div>
  <div style="text-align:right"><button class="btn primary" id="ms-close"></button></div>
</div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== Configuration ===================== */
const API_URL=new URLSearchParams(location.search).get('api')||'https://script.google.com/macros/s/AKfycbyh3_bgg0W8zoeBoswJwBfOEfvJ10sTsuhPqJTB0X5ccbLpXv70cysEXLQ-AkJWo5z0dA/exec';
const TOKEN=new URLSearchParams(location.search).get('t')||'';
const MAX_PX=3000; /* photos envoyées en haute qualité pour garder les détails */

/* ===================== Textes ===================== */
const L4=(fr,es,en,it)=>({fr,es,en,it});
const YESNO=[['oui',L4('Oui','Sí','Yes','Sì')],['non',L4('Non','No','No','No')]];
const SYMPTOMES=[['taches',L4('Taches','Manchas','Stains','Macchie')],['bulles',L4('Bulles','Burbujas','Bubbles','Bolle')],['plis',L4('Plis ou froissures','Pliegues o arrugas','Creases or wrinkles','Pieghe o grinze')],['marques_bobine',L4('Marques de bobine','Marcas de bobina','Core marks','Segni della bobina')],['rayures',L4('Rayures','Arañazos','Scratches','Graffi')],['decollement',L4('Décollement / délamination','Desprendimiento / delaminación','Peeling / delamination','Distacco / delaminazione')],['decoloration',L4('Décoloration','Decoloración','Discoloration','Scolorimento')],['adhesif',L4('Défaut d’adhésif','Defecto del adhesivo','Adhesive defect','Difetto dell’adesivo')],['dechire',L4('Film déchiré ou coupé','Lámina rota o cortada','Torn or cut film','Pellicola strappata o tagliata')],['autre',L4('Autre','Otro','Other','Altro')]];
const UI={
 sub:L4('Formulaire de réclamation','Formulario de reclamación','Claim form','Modulo di reclamo'),
 prev:L4('← Précédent','← Anterior','← Back','← Indietro'),next:L4('Suivant →','Siguiente →','Next →','Avanti →'),
 later:L4('Enregistrer et finir plus tard','Guardar y terminar más tarde','Save and finish later','Salva e completa più tardi'),
 send:L4('Envoyer le formulaire','Enviar el formulario','Send the form','Invia il modulo'),
 sending:L4('Envoi…','Enviando…','Sending…','Invio…'),
 saving:L4('Enregistrement…','Guardando…','Saving…','Salvataggio…'),savedAt:L4('Enregistré à','Guardado a las','Saved at','Salvato alle'),
 offline:L4('Gardé sur cet appareil (connexion impossible)','Guardado en este dispositivo (sin conexión)','Kept on this device (no connection)','Salvato su questo dispositivo (nessuna connessione)'),
 req:L4('Obligatoire','Obligatorio','Required','Obbligatorio'),opt:L4('facultatif','opcional','optional','facoltativo'),
 badEmail:L4('Adresse email invalide','Email no válido','Invalid email','Email non valida'),
 minText:L4('Décrivez en au moins 20 caractères','Describa con al menos 20 caracteres','Describe in at least 20 characters','Descrivere con almeno 20 caratteri'),
 choose:L4('— Choisir —','— Elegir —','— Choose —','— Scegliere —'),
 savedT:L4('Vos réponses sont enregistrées','Sus respuestas están guardadas','Your answers are saved','Le risposte sono salvate'),
 savedP:L4('Vous pouvez fermer cette page et revenir plus tard avec le même lien (aussi depuis un autre appareil) :','Puede cerrar esta página y volver más tarde con el mismo enlace (también desde otro dispositivo):','You can close this page and come back later with the same link (also from another device):','Potete chiudere questa pagina e tornare più tardi con lo stesso link (anche da un altro dispositivo):'),
 copy:L4('Copier','Copiar','Copy','Copia'),copied:L4('Copié','Copiado','Copied','Copiato'),close:L4('Fermer','Cerrar','Close','Chiudi'),
 introT:L4('Merci de nous avoir contactés.','Gracias por contactarnos.','Thank you for contacting us.','Grazie per averci contattato.'),
 introP:L4('Pour étudier votre réclamation, nous avons besoin de toutes les informations ci-dessous. Comptez environ 10 minutes. Préparez :','Para estudiar su reclamación necesitamos toda la información siguiente. Cuente unos 10 minutos. Tenga a mano:','To study your claim we need all the information below. It takes about 10 minutes. Please have ready:','Per esaminare il reclamo ci servono tutte le informazioni qui sotto. Circa 10 minuti. Tenete a portata di mano:'),
 introL:[L4('le n° de facture ou de commande','el nº de factura o pedido','the invoice or order number','il n. di fattura o ordine'),L4('le n° de lot (sur l’étiquette du carton)','el nº de lote (en la etiqueta de la caja)','the lot number (on the box label)','il n. di lotto (sull’etichetta della scatola)'),L4('les photos demandées','las fotos solicitadas','the requested photos','le foto richieste')],
 introS:L4('Vos réponses sont enregistrées automatiquement : vous pouvez terminer plus tard avec le même lien.','Sus respuestas se guardan automáticamente: puede terminar más tarde con el mismo enlace.','Your answers are saved automatically: you can finish later with the same link.','Le risposte vengono salvate automaticamente: potete completare più tardi con lo stesso link.'),
 introW:L4('Aucune demande ne peut être traitée tant que ce formulaire n’est pas complet.','Ninguna solicitud puede ser procesada hasta que este formulario esté completo.','No request can be processed until this form is complete.','Nessuna richiesta può essere elaborata finché il modulo non è completo.'),
 tips:L4('<b>Conseils photo :</b> photos nettes, à la lumière du jour, sans flash direct sur le film. Pour chaque défaut : une vue d’ensemble + un gros plan. Les photos sont envoyées en haute qualité, pour que nos techniciens puissent zoomer.','<b>Consejos para las fotos:</b> fotos nítidas, con luz natural, sin flash directo sobre la lámina. Para cada defecto: una vista general + un primer plano. Las fotos se envían en alta calidad para que nuestros técnicos puedan hacer zoom.','<b>Photo tips:</b> sharp photos, in daylight, no direct flash on the film. For each defect: an overall view + a close-up. Photos are sent in high quality so our technicians can zoom in.','<b>Consigli per le foto:</b> foto nitide, alla luce del giorno, senza flash diretto sulla pellicola. Per ogni difetto: una vista d’insieme + un primo piano. Le foto sono inviate in alta qualità, per permettere ai tecnici di ingrandire.'),
 add:L4('+ Ajouter','+ Añadir','+ Add','+ Aggiungi'),
 photoN:n=>L4(`${n} photo${n>1?'s':''}`,`${n} foto${n>1?'s':''}`,`${n} photo${n>1?'s':''}`,`${n} foto`),
 photoReq:L4('Au moins 1 photo','Al menos 1 foto','At least 1 photo','Almeno 1 foto'),
 upErr:L4('Envoi impossible, réessayez','No se pudo enviar, inténtelo de nuevo','Upload failed, try again','Invio non riuscito, riprovare'),
 missT:L4('Il manque encore :','Todavía falta:','Still missing:','Manca ancora:'),
 blocked:L4('Le formulaire ne peut être envoyé que lorsque tout est complété.','El formulario solo puede enviarse cuando todo esté completo.','The form can only be sent once everything is complete.','Il modulo può essere inviato solo quando tutto è completo.'),
 reviewT:L4('Vérifiez vos réponses','Revise sus respuestas','Check your answers','Controllate le risposte'),
 edit:L4('Modifier','Modificar','Edit','Modifica'),
 doneT:L4('Merci, votre formulaire a bien été envoyé','Gracias, su formulario ha sido enviado','Thank you, your form has been sent','Grazie, il modulo è stato inviato'),
 doneP:L4('Notre équipe va étudier votre dossier et reviendra vers vous. Référence de votre dossier :','Nuestro equipo estudiará su expediente y le contestará. Referencia de su expediente:','Our team will study your case and get back to you. Your case reference:','Il nostro team esaminerà la pratica e vi ricontatterà. Riferimento della pratica:'),
 doneOn:L4('Envoyé le','Enviado el','Sent on','Inviato il'),
 badT:L4('Lien invalide','Enlace no válido','Invalid link','Link non valido'),
 badP:L4('Ce lien n’est pas valide. Vérifiez l’adresse reçue par email ou contactez-nous.','Este enlace no es válido. Compruebe la dirección recibida por email o contáctenos.','This link is not valid. Check the address you received by email or contact us.','Questo link non è valido. Verificate l’indirizzo ricevuto via email o contattateci.'),
 netT:L4('Connexion impossible','Sin conexión','Cannot connect','Connessione impossibile'),
 netP:L4('Vérifiez votre connexion internet puis rechargez la page.','Compruebe su conexión a internet y recargue la página.','Check your internet connection and reload the page.','Verificate la connessione internet e ricaricate la pagina.'),
 legalT:L4('Conditions de traitement de votre réclamation','Condiciones de tramitación de su reclamación','Conditions for processing your claim','Condizioni di gestione del reclamo'),
 legal:[
  L4('Aucune demande ne peut être traitée tant que ce formulaire n’est pas entièrement complété et envoyé avec les photos demandées. Les demandes incomplètes sont classées sans suite.','Ninguna solicitud puede ser tramitada hasta que este formulario esté completamente rellenado y enviado con las fotos solicitadas. Las solicitudes incompletas se archivan sin más trámite.','No request can be processed until this form is fully completed and sent with the requested photos. Incomplete requests are closed without further action.','Nessuna richiesta può essere elaborata finché il modulo non è interamente compilato e inviato con le foto richieste. Le richieste incomplete vengono archiviate senza seguito.'),
  L4('L’ouverture d’un dossier ne vaut pas acceptation de la prise en charge. La garantie Reflectiv couvre exclusivement les défauts de fabrication du matériau (délamination, démétallisation, défauts de l’adhésif d’origine industrielle), conformément à la Politique officielle de garantie et de gestion des réclamations.','La apertura de un expediente no implica la aceptación de la cobertura. La garantía Reflectiv cubre exclusivamente los defectos de fabricación del material (delaminación, desmetalización, defectos del adhesivo de origen industrial), conforme a la Política oficial de garantía y gestión de reclamaciones.','Opening a case does not mean the claim is accepted. The Reflectiv warranty exclusively covers manufacturing defects of the material (delamination, demetallisation, adhesive defects of industrial origin), in accordance with the Official Warranty and Claims Management Policy.','L’apertura di una pratica non comporta l’accettazione della copertura. La garanzia Reflectiv copre esclusivamente i difetti di fabbricazione del materiale (delaminazione, demetallizzazione, difetti dell’adesivo di origine industriale), secondo la Politica ufficiale di garanzia e gestione dei reclami.'),
  L4('Sont notamment exclus : une préparation insuffisante du vitrage, l’absence de scellement périphérique en pose extérieure, un entretien inadapté (produits ammoniaqués, solvants, outils abrasifs, premier lavage avant 30 jours), le stress thermique dû à un ombrage irrégulier, et la pose extérieure sur surface horizontale ou inclinée à plus de 15° sans dérogation écrite du Département Technique.','Quedan excluidos en particular: una preparación insuficiente del vidrio, la ausencia de sellado perimetral en instalación exterior, un mantenimiento inadecuado (productos con amoníaco, disolventes, herramientas abrasivas, primer lavado antes de 30 días), el estrés térmico debido a sombras irregulares, y la instalación exterior en superficies horizontales o inclinadas más de 15° sin autorización escrita del Departamento Técnico.','Excluded in particular: insufficient glass preparation, no perimeter sealing on exterior installations, inadequate maintenance (ammonia-based products, solvents, abrasive tools, first wash before 30 days), thermal stress due to irregular shading, and exterior installation on horizontal surfaces or surfaces inclined more than 15° without written approval from the Technical Department.','Sono esclusi in particolare: una preparazione insufficiente del vetro, l’assenza di sigillatura perimetrale nelle applicazioni esterne, una manutenzione inadeguata (prodotti a base di ammoniaca, solventi, utensili abrasivi, primo lavaggio prima di 30 giorni), lo stress termico dovuto a ombreggiamento irregolare e l’applicazione esterna su superfici orizzontali o inclinate oltre 15° senza deroga scritta del Dipartimento Tecnico.'),
  L4('Les dommages de transport doivent faire l’objet de réserves précises sur le bon de livraison à la réception, confirmées par écrit au transporteur dans les délais légaux (3 jours en transport national français, art. L.133-3 du Code de commerce ; 7 jours pour les dommages non apparents en transport international, convention CMR art. 30).','Los daños de transporte deben indicarse con reservas precisas en el albarán de entrega en el momento de la recepción, y confirmarse por escrito al transportista en los plazos legales (3 días en transporte nacional francés, art. L.133-3 del Code de commerce; 7 días para daños no aparentes en transporte internacional, convenio CMR art. 30).','Transport damage must be recorded as precise reservations on the delivery note upon receipt, and confirmed in writing to the carrier within the legal deadlines (3 days for French domestic transport, art. L.133-3 Code de commerce; 7 days for non-apparent damage in international transport, CMR Convention art. 30).','I danni da trasporto devono essere indicati con riserve precise sulla bolla di consegna al momento del ricevimento e confermati per iscritto al vettore entro i termini di legge (3 giorni per il trasporto nazionale francese, art. L.133-3 Code de commerce; 7 giorni per i danni non apparenti nel trasporto internazionale, convenzione CMR art. 30).'),
  L4('Reflectiv peut demander des informations complémentaires, des échantillons ou une expertise avant toute décision. Toute information inexacte peut entraîner le refus de la demande.','Reflectiv puede solicitar información adicional, muestras o un peritaje antes de cualquier decisión. Cualquier información inexacta puede conllevar el rechazo de la solicitud.','Reflectiv may request additional information, samples or an expert assessment before any decision. Any inaccurate information may lead to the request being rejected.','Reflectiv può richiedere informazioni aggiuntive, campioni o una perizia prima di qualsiasi decisione. Qualsiasi informazione inesatta può comportare il rifiuto della richiesta.')],

/* ===================== État ===================== */
let R={}, FILES=[], CUR=0, CATALOG=[], CASE_ID='', saveTimer=null, lastSaved=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}
const LKEY='rf_form_'+TOKEN;
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(e._h);e._h=setTimeout(()=>e.hidden=true,2600)}
async function api(action,data={}){
  let r;try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,t:TOKEN,...data})})}catch(e){const x=new Error('net');x.net=true;throw x}
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Erreur');return j.data;
}
const flat=fields=>fields.flatMap(f=>f.row?f.row:[f]);
const visible=f=>!f.show||f.show(R);
function missingOf(step){
  const out=[];
  if(step.fields)flat(step.fields).filter(f=>f.id&&visible(f)&&!f.opt).forEach(f=>{
    const v=R[f.id];
    if(f.t==='checks'?!(Array.isArray(v)&&v.length):!String(v??'').trim())out.push({f,why:'req'});
    else if(f.t==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))out.push({f,why:'email'});
    else if(f.min&&String(v).trim().length<f.min)out.push({f,why:'min'});
  });
  if(step.photos)PHOTOS.filter(p=>!p.opt&&(!p.show||p.show(R))).forEach(p=>{if(!FILES.some(x=>x.cat===p.id&&x.fid)&&!(p.na&&R['na_'+p.id]))out.push({p})});
  if(step.review&&!(R.accepte_exactitude&&R.accepte_conditions))out.push({consent:true});
  return out;
}
const allMissing=()=>STEPS.map((s,i)=>({i,s,m:missingOf(s)})).filter(x=>x.m.length);

/* ===================== Rendu ===================== */
function applyLang(){
  document.documentElement.lang=LANG;$('#lang').value=LANG;$('#h-sub').textContent=tr(UI.sub);
  $('#b-prev').textContent=tr(UI.prev);$('#b-later').textContent=tr(UI.later);
  $('#ms-t').textContent=tr(UI.savedT);$('#ms-p').textContent=tr(UI.savedP);$('#ms-copy').textContent=tr(UI.copy);$('#ms-close').textContent=tr(UI.close);
}
function renderSteps(){
  $('#steps').innerHTML=STEPS.map((s,i)=>{const n=missingOf(s).length;const cls=i===STEPS.length-1?'':(n?'miss':'ok');
    return `<button class="${cls}" data-i="${i}" ${i===CUR?'aria-current="step"':''}><i>${cls==='ok'?'✓':i+1}</i>${esc(tr(s.title))}</button>`}).join('');
  $('#steps').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  $('#steps [aria-current]')?.scrollIntoView({block:'nearest',inline:'center'});
}
function fieldHTML(f){
  if(!visible(f))return'';
  if(f.t==='sub')return `<div class="sub">${esc(tr(f.l))}</div>`;
  if(f.t==='warn')return `<div class="warn">${tr(f.html)}</div>`;
  const v=R[f.id]??'';const id='q-'+f.id;const ph=f.ph?` placeholder="${esc(tr(f.ph))}"`:'';
  const lab=`${esc(tr(f.l))}${f.opt?` <span class="help">(${tr(UI.opt)})</span>`:'<span class="req" aria-hidden="true">*</span>'}`;
  const help=f.h?`<div class="help">${esc(tr(f.h))}</div>`:'';
  const bad=`<div class="bad-msg" id="e-${f.id}"></div>`;
  let input;
  if(['text','email','tel','number','date'].includes(f.t))input=`<input class="inp" id="${id}" data-q="${f.id}" type="${f.t}" value="${esc(v)}"${ph}${f.ac?` autocomplete="${f.ac}"`:''}${f.t==='number'?' min="0" inputmode="decimal"':''}${f.list?' list="dl-cat"':''}>`;
  else if(f.t==='textarea')input=`<textarea class="inp" id="${id}" data-q="${f.id}"${ph}>${esc(v)}</textarea>`;
  else if(f.t==='select')input=`<select class="inp" id="${id}" data-q="${f.id}" data-re="1"><option value="">${tr(UI.choose)}</option>${f.o.map(([k,l])=>`<option value="${k}" ${String(v)===k?'selected':''}>${esc(tr(l))}</option>`).join('')}</select>`;
  else if(f.t==='radio')input=`<div class="opts" role="radiogroup">${f.o.map(([k,l])=>`<label class="opt"><input type="radio" name="${id}" data-q="${f.id}" data-re="1" value="${k}" ${v===k?'checked':''}>${esc(tr(l))}</label>`).join('')}</div>`;
  else if(f.t==='checks')input=`<div class="opts">${f.o.map(([k,l])=>`<label class="opt"><input type="checkbox" data-qc="${f.id}" value="${k}" ${(Array.isArray(v)&&v.includes(k))?'checked':''}>${esc(tr(l))}</label>`).join('')}</div>`;
  else if(f.t==='types')return `<div class="f" id="w-${f.id}"><div class="lbl">${lab}</div><div class="typecards">${f.o.map(([k,ic,t1,t2])=>`<label class="typecard"><input type="radio" name="${id}" data-q="${f.id}" data-re="1" value="${k}" ${v===k?'checked':''}><span class="ic">${ic}</span><div><strong>${esc(tr(t1))}</strong><span>${esc(tr(t2))}</span></div></label>`).join('')}</div>${bad}</div>`;
  const tag=['radio','checks'].includes(f.t)?'div':'label';
  return `<div class="f" id="w-${f.id}"><${tag==='label'?`label for="${id}"`:'div class="lbl"'}>${lab}</${tag}>${help}${input}${bad}</div>`;
}
function photosHTML(){
  const cats=PHOTOS.filter(p=>!p.show||p.show(R));
  return `<div class="tips">${tr(UI.tips)}</div><div class="fields">${cats.map(p=>{
    const list=FILES.filter(x=>x.cat===p.id);const ok=list.some(x=>x.fid);const na=p.na&&R['na_'+p.id];
    const cnt=p.opt?(list.length?`<span class="pcount ok">${tr(UI.photoN(list.length))}</span>`:`<span class="pcount">${tr(UI.opt)}</span>`):(ok||na?`<span class="pcount ok">✓ ${list.length?tr(UI.photoN(list.length)):'—'}</span>`:`<span class="pcount miss">${tr(UI.photoReq)}</span>`);
    return `<div class="pcat" id="w-p-${p.id}"><div class="pcat-h"><div><strong>${esc(tr(p.l))}${p.opt?'':'<span class="req" style="color:var(--red)">*</span>'}</strong><span>${esc(tr(p.h))}</span></div>${cnt}</div>
    <div class="thumbs">${list.map(x=>`<div class="th${x.err?' err':''}">${x.url?`<img src="${x.url}" alt="">`:(x.mime==='application/pdf'?'PDF':'…')}${x.busy?'<div class="ld"><span class="spin"></span></div>':''}${x.busy?'':`<button class="x" data-rm="${esc(x.key)}" aria-label="×">×</button>`}</div>`).join('')}
      ${na?'':`<label class="addp">${tr(UI.add)}<input type="file" hidden multiple accept="image/*${p.pdf?',application/pdf':''}" data-up="${p.id}"></label>`}</div>
    ${p.na?`<label class="na"><input type="checkbox" data-na="${p.id}" ${na?'checked':''}>${esc(tr(p.naL))}</label>${na?`<div class="warn">${esc(tr(p.naW))}</div>`:''}`:''}</div>`}).join('')}</div>`;
}
function valueText(f,v,lang){
  const pick=o=>o?(o[lang]||o.fr):'';
  if(f.t==='checks')return (v||[]).map(k=>pick((f.o.find(o=>o[0]===k)||[])[1])||k).join(', ');
  if(f.o){const o=f.o.find(o=>o[0]===v);return o?pick(f.t==='types'?o[2]:o[1]):(v||'')}
  return String(v??'');
}
function summary(lang){
  const pick=o=>o?(o[lang]||o.fr):'';
  const out=STEPS.filter(s=>s.fields).map(s=>({s:pick(s.title),i:STEPS.indexOf(s),items:flat(s.fields).filter(f=>f.id&&visible(f)&&String(R[f.id]??'')!=='').map(f=>[pick(f.l),valueText(f,R[f.id],lang)])}));
  out.push({s:pick(STEPS.find(s=>s.photos).title),i:STEPS.findIndex(s=>s.photos),items:PHOTOS.filter(p=>!p.show||p.show(R)).map(p=>{const n=FILES.filter(x=>x.cat===p.id&&x.fid).length;return[pick(p.l),p.na&&R['na_'+p.id]?pick(p.naL):String(n)]})});
  return out;
}
function reviewHTML(){
  const miss=allMissing().filter(x=>x.i!==STEPS.length-1||x.m.some(m=>!m.consent));
  const consentMiss=!(R.accepte_exactitude&&R.accepte_conditions);
  return `<div class="review">${summary(LANG).map(s=>`<section><h3>${esc(s.s)}<button data-go="${s.i}">${tr(UI.edit)}</button></h3><dl>${s.items.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></section>`).join('')}</div>
  <div class="legal" style="margin-top:16px"><h2>${tr(UI.legalT)}</h2><ol>${UI.legal.map(x=>`<li>${esc(tr(x))}</li>`).join('')}</ol></div>
  <div class="fields" style="margin-top:14px">
   <label class="consent"><input type="checkbox" data-cs="accepte_exactitude" ${R.accepte_exactitude?'checked':''}><span>${esc(tr(UI.c1))}</span></label>
   <label class="consent"><input type="checkbox" data-cs="accepte_conditions" ${R.accepte_conditions?'checked':''}><span>${esc(tr(UI.c2))}</span></label>
   ${miss.length||consentMiss?`<div class="missing"><b>${tr(UI.missT)}</b><ul>${miss.map(x=>`<li><a data-go="${x.i}">${esc(tr(x.s.title))}</a> : ${x.m.map(m=>m.f?esc(tr(m.f.l)):m.p?esc(tr(m.p.l)):'').filter(Boolean).join(', ')}</li>`).join('')}${consentMiss?`<li>${tr(UI.consentMiss)}</li>`:''}</ul><div style="margin-top:6px">${tr(UI.blocked)}</div></div>`:''}
  </div>`;
}
function render(){
  const s=STEPS[CUR];
  let h=`<h1>${esc(tr(s.title))}</h1>`;
  if(s.intro)h+=`<div class="intro"><b>${tr(UI.introT)}</b> ${tr(UI.introP)}<ul>${UI.introL.map(x=>`<li>${tr(x)}</li>`).join('')}</ul><div style="margin-top:8px">${tr(UI.introS)}</div><div style="margin-top:8px;font-weight:600">⚠ ${tr(UI.introW)}</div></div>`;
  if(s.id==='type'&&!R.type)h+=`<p class="lead">${tr(L4('La suite du formulaire s’adapte à votre réponse.','El resto del formulario se adapta a su respuesta.','The rest of the form adapts to your answer.','Il resto del modulo si adatta alla risposta.'))}</p>`;
  if(s.fields)h+=`<div class="fields">${s.fields.map(f=>f.row?(f.row.some(visible)?`<div class="row2">${f.row.map(fieldHTML).join('')}</div>`:''):fieldHTML(f)).join('')}</div>`;
  if(s.photos)h+=photosHTML();
  if(s.review)h+=reviewHTML();
  $('#card').innerHTML=h+(CATALOG.length?`<datalist id="dl-cat">${CATALOG.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`:'');
  bind();renderSteps();renderBar();
  if(s._shown)markMissing(s);
}
function renderBar(){
  const last=CUR===STEPS.length-1;$('#b-prev').disabled=CUR===0;
  const b=$('#b-next');b.textContent=last?tr(UI.send):tr(UI.next);b.disabled=last&&allMissing().length>0;
}
function markMissing(s){
  const m=missingOf(s);
  document.querySelectorAll('.f.bad,.pcat.bad').forEach(e=>e.classList.remove('bad'));
  m.forEach(x=>{
    if(x.f){const w=$('#w-'+x.f.id);if(w){w.classList.add('bad');$('#e-'+x.f.id).textContent=x.why==='email'?tr(UI.badEmail):x.why==='min'?tr(UI.minText):tr(UI.req)}}
    if(x.p)$('#w-p-'+x.p.id)?.classList.add('bad');
  });
  return m;
}
function bind(){
  const card=$('#card');
  card.querySelectorAll('[data-q]').forEach(el=>{
    const ev=el.dataset.re?'change':'input';
    el.addEventListener(ev,()=>{R[el.dataset.q]=el.type==='radio'?el.value:el.value;changed();if(el.dataset.re){render()}else{if(STEPS[CUR]._shown)markMissing(STEPS[CUR]);renderSteps();renderBar()}});
  });
  card.querySelectorAll('[data-qc]').forEach(el=>el.addEventListener('change',()=>{const k=el.dataset.qc;R[k]=[...card.querySelectorAll(`[data-qc="${k}"]:checked`)].map(x=>x.value);changed();if(STEPS[CUR]._shown)markMissing(STEPS[CUR]);renderSteps();renderBar()}));
  card.querySelectorAll('[data-cs]').forEach(el=>el.addEventListener('change',()=>{R[el.dataset.cs]=el.checked;changed();render()}));
  card.querySelectorAll('[data-na]').forEach(el=>el.addEventListener('change',()=>{R['na_'+el.dataset.na]=el.checked;changed();render()}));
  card.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(+el.dataset.go));
  card.querySelectorAll('[data-up]').forEach(el=>el.onchange=()=>{addFiles(el.dataset.up,[...el.files]);el.value=''});
  card.querySelectorAll('[data-rm]').forEach(el=>el.onclick=()=>removeFile(el.dataset.rm));
}
function go(i){
  if(i<0||i>=STEPS.length)return;
  STEPS[CUR]._shown=true;CUR=i;render();window.scrollTo({top:0,behavior:'smooth'});saveNow();
}
$('#b-prev').onclick=()=>go(CUR-1);
$('#b-next').onclick=()=>{
  if(CUR===STEPS.length-1){submit();return}
  const s=STEPS[CUR];s._shown=true;const m=markMissing(s);
  if(m.length){const first=m[0];const el=first.f?$('#w-'+first.f.id):first.p?$('#w-p-'+first.p.id):null;el?.scrollIntoView({behavior:'smooth',block:'center'})}
  go(CUR+1); /* on peut avancer : les manques restent signalés et bloquent l'envoi */
};
$('#lang').onchange=e=>{LANG=e.target.value;lsSet('rf_lang',LANG);applyLang();render();changed()};

/* ===================== Enregistrement ===================== */
function setSaveState(s){const e=$('#savest');e.classList.toggle('err',s==='off');
  e.innerHTML=s==='busy'?`<span class="spin" style="width:12px;height:12px;vertical-align:-2px"></span> ${tr(UI.saving)}`:s==='off'?tr(UI.offline):lastSaved?`✓ ${tr(UI.savedAt)} ${lastSaved.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`:''}
function changed(){lsSet(LKEY,{r:R,ts:Date.now()});clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,2500)}
let saving=null;
async function saveNow(){
  clearTimeout(saveTimer);if(saving)return saving;
  setSaveState('busy');
  saving=api('formSave',{reponses:R,lang:LANG}).then(()=>{lastSaved=new Date();setSaveState('ok');return true}).catch(e=>{setSaveState('off');return false}).finally(()=>saving=null);
  return saving;
}
$('#b-later').onclick=async()=>{await saveNow();$('#ms-link').value=location.href;$('#m-saved').hidden=false};
$('#ms-close').onclick=()=>$('#m-saved').hidden=true;
$('#ms-copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#ms-link').value);toast(tr(UI.copied))}catch(_){$('#ms-link').select()}};

/* ===================== Photos ===================== */
let upQueue=Promise.resolve(),keyN=0;
async function prep(file){
  if(file.type==='application/pdf')return{blob:file,mime:'application/pdf'};
  try{const bmp=await createImageBitmap(file);const s=Math.min(1,MAX_PX/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return{blob:await new Promise(r=>cv.toBlob(r,'image/jpeg',.9)),mime:'image/jpeg'}}
  catch(_){return{blob:file,mime:/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)?file.type:'image/jpeg'}}
}
const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
function addFiles(cat,files){
  files.forEach(file=>{
    const x={key:'k'+(++keyN),cat,busy:true,mime:file.type,url:file.type.startsWith('image/')?URL.createObjectURL(file):''};FILES.push(x);
    upQueue=upQueue.then(async()=>{
      try{const p=await prep(file);const r=await api('formUpload',{cat,file:{mime:p.mime,name:file.name,data:await b64(p.blob)}});
        x.fid=r.fid;x.name=r.name;x.busy=false;x.err=false}
      catch(e){x.busy=false;x.err=true;toast(tr(UI.upErr)+(e.net?'':' ('+e.message+')'))}
      if(STEPS[CUR].photos)render();else{renderSteps();renderBar()}
    });
  });
  render();
}
async function removeFile(key){
  const x=FILES.find(f=>f.key===key);if(!x)return;
  FILES=FILES.filter(f=>f!==x);render();
  if(x.fid){try{await api('formRemoveFile',{fid:x.fid})}catch(_){}}
}
function loadThumb(x){api('formMedia',{fid:x.fid}).then(m=>{if(m&&m.data){x.url=`data:${m.mime};base64,${m.data}`;if(STEPS[CUR].photos)render()}}).catch(()=>{})}

/* ===================== Envoi ===================== */
async function submit(){
  if(allMissing().length){render();return}
  const b=$('#b-next');b.disabled=true;b.textContent=tr(UI.sending);
  try{await api('formSubmit',{reponses:R,resume:summary('fr').map(({s,items})=>({s,items})),lang:LANG});
    try{localStorage.removeItem(LKEY)}catch(_){}
    showDone(new Date().toISOString());
  }catch(e){toast(e.net?tr(UI.offline):e.message);renderBar()}
}
function showDone(when){
  $('#app').hidden=true;$('#bar').hidden=true;$('#savest').textContent='';
  const d=$('#done');d.hidden=false;
  d.innerHTML=`<div class="big">✅</div><h1>${tr(UI.doneT)}</h1><p>${tr(UI.doneP)} <b>${esc(CASE_ID)}</b></p>${when?`<p class="lead">${tr(UI.doneOn)} ${new Date(when).toLocaleString()}</p>`:''}`;
}
function showError(t,p){$('#loading').hidden=true;const d=$('#done');d.hidden=false;d.innerHTML=`<div class="big">⚠️</div><h1>${tr(t)}</h1><p>${tr(p)}</p>`}

/* ===================== Démarrage ===================== */
(async function boot(){
  const nav=(navigator.language||'fr').slice(0,2);
  LANG=lsGet('rf_lang')||(['fr','es','en','it'].includes(nav)?nav:'en');applyLang();
  if(!TOKEN){showError(UI.badT,UI.badP);return}
  let d;
  try{d=await api('formGet')}catch(e){showError(e.net?UI.netT:UI.badT,e.net?UI.netP:UI.badP);return}
  CASE_ID=d.caseId||'';CATALOG=d.catalogue||[];
  if(!lsGet('rf_lang')&&d.lang)LANG=['fr','es','en','it'].includes(d.lang)?d.lang:'en';applyLang();
  $('#loading').hidden=true;
  if(d.statut==='soumis'){showDone(d.envoye);return}
  R=Object.assign({},d.prefill?Object.fromEntries(Object.entries(d.prefill).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>[k,String(v)])):{},d.reponses||{});
  const local=lsGet(LKEY);if(local&&local.r)R=Object.assign(R,local.r);
  FILES=(d.fichiers||[]).map(f=>({key:'k'+(++keyN),fid:f.fid,cat:f.cat,name:f.name,mime:/\.pdf$/i.test(f.name)?'application/pdf':'image/jpeg'}));
  FILES.filter(f=>f.mime!=='application/pdf').forEach(loadThumb);
  const firstMiss=allMissing()[0];CUR=Object.keys(d.reponses||{}).length&&firstMiss?firstMiss.i:0;
  $('#app').hidden=false;$('#bar').hidden=false;render();
  if(local&&local.r)changed();
})();
</script>
